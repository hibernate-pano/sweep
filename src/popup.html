<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Clear Browsing Data</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="panel">
      <header class="bar">
        <div class="identity">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.6" class="mark-track" />
            <path d="M12 3.4a8.6 8.6 0 1 1-8.6 8.6" class="mark-arc" />
            <rect x="16.1" y="4.3" width="4.6" height="4.6" rx="1.5" class="mark-block" />
          </svg>
          <span class="wordmark">Clear Browsing Data</span>
        </div>
        <button id="btn-options" class="icon-btn" type="button" title="设置" aria-label="打开设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" />
            <path
              d="M19.1 14.6a1.6 1.6 0 0 0 .32 1.76l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.76-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.95 1.95 0 1 1-3.9 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.76.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.97H3.9a1.95 1.95 0 1 1 0-3.9h.09A1.6 1.6 0 0 0 5.46 8.4a1.6 1.6 0 0 0-.32-1.76l-.06-.06a1.95 1.95 0 1 1 2.76-2.76l.06.06a1.6 1.6 0 0 0 1.76.32h.08a1.6 1.6 0 0 0 .97-1.47V3.6a1.95 1.95 0 1 1 3.9 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.76-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.76v.08a1.6 1.6 0 0 0 1.47.97h.17a1.95 1.95 0 1 1 0 3.9h-.09a1.6 1.6 0 0 0-1.47.97Z"
            />
          </svg>
        </button>
      </header>

      <main>
        <!-- 目标：这个网站留下了多少东西 -->
        <section class="subject">
          <div class="subject-line" id="subject-line">
            <span class="favicon" id="favicon">
              <img id="favicon-img" alt="" hidden />
              <span id="avatar"></span>
            </span>
            <span class="host" id="site-host">正在读取…</span>
            <span class="size" id="site-size"></span>
          </div>

          <div class="meter" id="meter">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
                <circle class="ring-track" cx="50" cy="50" r="40" />
                <g id="ring-segments"></g>
              </svg>
              <div class="ring-core" id="ring-core">
                <span class="core-value" id="core-value">0</span>
                <span class="core-label" id="core-label">项数据</span>
              </div>
            </div>
            <ul class="legend" id="legend"></ul>
          </div>

          <p class="subject-note" id="subject-note" hidden></p>
        </section>

        <!-- 云端会话：本地清理动不了的部分 -->
        <section class="cloud" id="cloud-card" hidden>
          <div class="cloud-body">
            <p class="cloud-title" id="cloud-title"></p>
            <p class="cloud-sub" id="cloud-sub"></p>
          </div>
          <button class="text-btn" id="btn-cloud" type="button">删除</button>
        </section>

        <!-- 动作 -->
        <section class="action">
          <div class="scope" id="scope" role="radiogroup" aria-label="清理范围">
            <button type="button" data-scope="current" role="radio" aria-checked="true">当前网站</button>
            <button type="button" data-scope="all" role="radio" aria-checked="false">全部网站</button>
            <button type="button" data-scope="custom" role="radio" aria-checked="false">自选</button>
          </div>
          <button class="cta" id="btn-clean" type="button">
            <span class="cta-fill" id="cta-fill"></span>
            <span class="cta-label" id="cta-label">清空足迹</span>
          </button>
        </section>

        <!-- 清理项 -->
        <section class="options">
          <div class="toggles" id="chips" role="group" aria-label="清理项目"></div>
          <div class="window" id="window" hidden>
            <span class="window-label">时间范围</span>
            <div class="window-opts" id="range-opts" role="radiogroup" aria-label="时间范围"></div>
          </div>
          <div class="custom" id="custom-list" hidden></div>
        </section>
      </main>

      <footer class="foot">
        <span id="last-run">尚未清理过</span>
        <button class="link" id="btn-reset" type="button">重置选项</button>
      </footer>
    </div>

    <dialog id="confirm-dialog">
      <form method="dialog">
        <h3 id="confirm-title"></h3>
        <p id="confirm-body"></p>
        <menu>
          <button value="cancel" class="ghost-btn" id="confirm-cancel" type="submit">取消</button>
          <button value="ok" class="danger-btn" id="confirm-ok" type="submit">确认</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
